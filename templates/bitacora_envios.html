
{% extends "Dashboard.html" %}

{% block title %}Bitacora de envios{% endblock %}

{% block NavBar %}Bitacora de envios{% endblock %}

{% block content %}


<div id="wrapper">
	<div class="main-content">
		<div class="row small-spacing">
			<div class="col-xs-12">

                <div class="switch info"><input type="checkbox" id="switch-4"><label for="switch-4">ver paqueterias</label></div>

                <!-- Paqueterias -->
				<div class="box-content" id="paqueterias" style="display: none;">
					<h4 class="box-title">Tabla de paqueterias</h4>
					<!-- /.box-title -->

					<button type="button" class="btn btn-success btn-xs waves-effect waves-light margin-bottom-20" data-toggle="modal" data-target="#boostrapModal-3" id="agregarPaqueteria"><i class="fa fa-plus"></i> Agregar</button>

					<table id="paqueteriaTable" class="table table-small-font table-hover table-bordered display" style="width:100%"></table>
					
				</div>
				<!-- /.box-content -->
                      

                <!-- Envios -->
				<div class="box-content">
					<h4 class="box-title">Tabla de envios</h4>
					<!-- /.box-title -->

					<button type="button" class="btn btn-success btn-xs waves-effect waves-light margin-bottom-20" data-toggle="modal" data-target="#boostrapModal-1" id="agregarEnvio"><i class="fa fa-plus"></i> Agregar</button>

					<table id="envioTable" class="table table-small-font table-hover table-bordered display" style="width:100%"></table>
				</div>
				<!-- /.box-content -->
			</div>
		</div>
		<!-- /.row -->		
	</div>
	<!-- /.main-content -->
</div><!--/#wrapper -->


<!-- AQUI ESTAN LOS MODALES -->
<!-- Modal -->
<div class="modal fade" id="boostrapModal-1" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
				<h4 class="modal-title" id="myModalLabel">Titulo dinamico</h4>
			</div>
			<div class="modal-body">
				<div class="form-group">
					<label>Numero de guia</label>
					<input type="text" class="form-control" id="numeroGuia">
				</div>
				<div class="form-group">
					<label>Socio comercial</label>
					<select class="form-control" id="socio_menu"></select>
				</div>
				<div class="form-group">
					<label>Paqueteria</label>
					<select class="form-control" id="paqueteria_menu"></select>
				</div>

				<div class="form-group">
					<label>Fecha</label>
                    <input type="text" class="form-control" placeholder="aaaa-mm-dd" id="fechaIngreso" autocomplete="off">
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-default btn-xs waves-effect waves-light" data-dismiss="modal">Cerrar</button>
				<button type="button" class="btn btn-primary btn-xs waves-effect waves-light">Guardar</button>
			</div>
		</div>
	</div>
</div>

<div class="modal fade" id="boostrapModal-3" tabindex="-3" role="dialog" aria-labelledby="myModalLabel">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
				<h4 class="modal-title" id="myModalLabel3">Titulo dinamico</h4>
			</div>
			<div class="modal-body">
				<div class="form-group">
					<label>Nombre de la paqueteria</label>
					<input type="text" class="form-control" id="nombrePaqueteria">
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-default btn-xs waves-effect waves-light" data-dismiss="modal">Cerrar</button>
				<button type="button" class="btn btn-primary btn-xs waves-effect waves-light">Guardar</button>
			</div>
		</div>
	</div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='assets/JS/bitacora_envios.js') }}"></script>
<script src="{{ url_for('static', filename='assets/JS/paqueterias.js') }}"></script>
<script src="{{ url_for('static', filename='assets/JS/socios_comerciales.js') }}"></script>

{% endblock %}
