{% extends "Dashboard.html" %}

{% block title %}Colaboradores{% endblock %}

{% block content %}
<div class="fixed-navbar">
	<div class="pull-left">
		<button type="button" class="menu-mobile-button glyphicon glyphicon-menu-hamburger js__menu_mobile"></button>
		<h1 class="page-title">Colaboradores</h1>
		<!-- /.page-title -->
	</div>
	<!-- /.pull-left -->
	<div class="pull-right">
		<a id="cerrarSesion" class="ico-item fa fa-power-off logout"></a>
	</div>
	<!-- /.pull-right -->
</div>

<div id="wrapper">
	<div class="main-content">
		<div class="row small-spacing">
			<div class="col-xs-12">
				<div class="box-content">
					<h4 class="box-title">Tabla de colaboradores</h4>
					<!-- /.box-title -->

					<button type="button" class="btn btn-success btn-xs waves-effect waves-light margin-bottom-10" data-toggle="modal" data-target="#boostrapModal-1" id="agregarColaborador"><i class="fa fa-plus"></i> Agregar</button>
 
					<table id="colaboradorTable" class="table table-small-font table-hover table-bordered display nowrap" style="width:100%">

					</table>
					
				</div>
				<!-- /.box-content -->
			</div>
			
		</div>
		<!-- /.row -->		
	</div>
	<!-- /.main-content -->
</div><!--/#wrapper -->

<!-- Modal -->
<div class="modal fade" id="boostrapModal-1" tabindex="-1" role="dialog" aria-labelledby="myModalLabel">
	<div class="modal-dialog" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
				<h4 class="modal-title" id="myModalLabel">Agregar colaborador</h4>
			</div>
			<div class="modal-body">
				<div class="form-group">
					<label>Nombre del empleado</label>
					<input type="text" placeholder="Ej. Armando Esteban Quito" class="form-control" id="nombreEmpleado">
				</div>
				<div class="form-group">
					<label>Fecha de ingreso</label>
					<input type="text" class="form-control" placeholder="aaaa-mm-dd" id="fechaIngreso" autocomplete="off">
				</div>
				<div class="form-group">
					<label>Sueldo de nomina</label>
					<input type="number" placeholder="0.00" class="form-control" id="nomina">
				</div>
				<div class="form-group">
					<label>Sueldo de vales</label>
					<input type="number" placeholder="0.00" class="form-control" id="vale">
				</div>
				<div class="form-group">
					<label>Asignar puesto</label>
					<select class="form-control" id="puesto_menu" >
					</select>
				</div>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-default btn-xs waves-effect waves-light" data-dismiss="modal">Cerrar</button>
				<button type="button" class="btn btn-primary btn-xs waves-effect waves-light">Guardar</button>
			</div>
		</div>
	</div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='assets/JS/colaboradores.js') }}"></script>
<script src="{{ url_for('static', filename='assets/JS/puestos.js') }}"></script>
{% endblock %}
